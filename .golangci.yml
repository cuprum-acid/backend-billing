# golangci-lint configuration for backend-billing
# Version: 2.x

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - makezero
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - bodyclose
    - errorlint
    - gosec
    - gocritic
  disable:
    - noctx

formatters:
  enable:
    - gofmt

issues:
  exclude:
    - text: "exitAfterDefer"
